version: '3.8'

services:
  api:
    build: .
    container_name: content-processor-api
    ports:
      - "8000:8000"
    environment:
      - TEMP_DIR=/app/temp
      - GOOGLE_DRIVE_AUDIO_FOLDER_ID=${GOOGLE_DRIVE_AUDIO_FOLDER_ID}
      - GOOGLE_DRIVE_MEME_FOLDER_ID=${GOOGLE_DRIVE_MEME_FOLDER_ID}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - XAI_API_KEY=${XAI_API_KEY}
      - ELEVEN_LABS_API=${ELEVEN_LABS_API}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ELEVENLABS_DB_PATH=/app/data/elevenlabs.db
      - YOUTUBE_COOKIES_FILE=/app/cookies.txt
      - YOUTUBE_COOKIES_CONTENT=${YOUTUBE_COOKIES_CONTENT:-}
      - YOUTUBE_PROXY=${YOUTUBE_PROXY:-}
      - YOUTUBE_PLAYER_CLIENT=${YOUTUBE_PLAYER_CLIENT:-android,web}
      - YOUTUBE_DOWNLOAD_QUALITY=${YOUTUBE_DOWNLOAD_QUALITY:-720p}
      - APIFY_TOKEN=${APIFY_TOKEN:-}
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./cookies.txt:/app/cookies.txt:ro
      - temp_data:/app/temp
      - elevenlabs_data:/app/data
      - ./grok_system_prompt.txt:/app/grok_system_prompt.txt:ro
      - ./template_script_prompt.txt:/app/template_script_prompt.txt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  temp_data:
  elevenlabs_data:
