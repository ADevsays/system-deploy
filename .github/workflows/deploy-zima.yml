name: Deploy to ZimaBoard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-deploy-zima
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, system-deploy]
    steps:
      - name: Deploy the published revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          git config --global --add safe.directory /DATA/system-deploy
          cd /DATA/system-deploy
          git fetch --quiet origin main
          git checkout --quiet --detach "$REVISION"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /DATA/system-deploy:/DATA/system-deploy \
            -w /DATA/system-deploy \
            docker:27-cli \
            compose --env-file .env -f docker-compose.zima.yml -p system-deploy up -d --build --force-recreate
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "system-deploy did not become ready within one minute." >&2
          exit 1


