name: Remove ZimaBoard runner

on:
  push:
    branches:
      - main

jobs:
  remove-runner:
    runs-on: [self-hosted, linux, x64, system-deploy]
    steps:
      - name: Remove runner and its unused Docker data
        run: |
          set -eu
          docker run -d --rm --name system-deploy-runner-remover \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --entrypoint sh docker:27-cli \
            -c 'sleep 60; docker rm -f system-deploy-github-runner || true; docker volume rm system-deploy-runner_github_actions_runner || true; docker system prune -af'
